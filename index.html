<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OUTFIT AT LAST</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>OUTFIT AT LAST</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <h2>Welcome to OUTFIT AT LAST</h2>

        <p>Anime-inspired clothing for your style.</p>

        <a href="#products" class="button">Shop Now</a>
    </section>

    <section id="products">

        <h2>Our Products</h2>

        <div class="products">

            <div class="product">
                <div class="product-image">👕</div>
                <h3>Anime T-Shirt</h3>
                <p>₹499</p>

                <button onclick="addToCart('Anime T-Shirt')">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <div class="product-image">🧥</div>
                <h3>Anime Hoodie</h3>
                <p>₹999</p>

                <button onclick="addToCart('Anime Hoodie')">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <div class="product-image">👖</div>
                <h3>Streetwear Jeans</h3>
                <p>₹1,199</p>

                <button onclick="addToCart('Streetwear Jeans')">
                    Add to Cart
                </button>
            </div>

        </div>

    </section>

    <section id="contact">

        <h2>Contact Us</h2>

        <p>Email: yourstore@example.com</p>

        <p>Phone: +91 XXXXX XXXXX</p>

    </section>

    <footer>

        <p>© 2026 OUTFIT AT LAST</p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
